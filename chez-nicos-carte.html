<style>
:root{
  --burgundy:#5A1520;
  --burgundy-deep:#3B0C14;
  --cream:#F7EFDD;
  --board:#FCF8EF;
  --ink:#2B1A1C;
  --ink-soft:#7A6560;
  --gold:#D9A431;
  --sweet:#C74F84;
  --savory:#3C6FB5;
  --rule:#DCCDB4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--burgundy-deep);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.45;
}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 64px}

/* ---------- Enseigne ---------- */
.sign{
  background:var(--burgundy);
  color:var(--cream);
  padding:34px 20px 28px;
  text-align:center;
  border-bottom:6px solid var(--gold);
}
.sign h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-optical-sizing:auto;
  font-weight:800;
  font-size:clamp(2.6rem,13vw,4.4rem);
  line-height:.92;
  margin:0;
  letter-spacing:-.02em;
}
.sign .meta{
  margin:14px auto 0;
  max-width:34ch;
  font-size:.9rem;
  color:#E8D5B4;
}
.sign .meta b{color:var(--cream);font-weight:600}

/* ---------- Langues ---------- */
.langs{
  display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  padding:12px;background:var(--burgundy-deep);
  position:sticky;top:0;z-index:20;
}
.langs button{
  font:inherit;font-size:.82rem;font-weight:600;
  background:transparent;color:#D9BFA0;
  border:1px solid #6E2C36;border-radius:999px;
  padding:6px 14px;cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--burgundy-deep);border-color:var(--gold)}
.langs button:focus-visible,.nav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Sommaire ---------- */
.nav{
  display:flex;gap:8px;overflow-x:auto;padding:12px 4px;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav a{
  flex:0 0 auto;text-decoration:none;
  font-size:.8rem;font-weight:600;letter-spacing:.01em;
  color:var(--cream);border:1px solid #6E2C36;border-radius:999px;
  padding:7px 14px;white-space:nowrap;
}

/* ---------- Panneau ---------- */
.board{
  background:var(--board);
  border-radius:3px;
  padding:26px 20px 30px;
  box-shadow:0 1px 0 #fff inset;
}
.section+.section{margin-top:34px}
.section h2{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:700;font-size:1.45rem;margin:0;
  letter-spacing:-.01em;
}
.section .sub{margin:4px 0 0;font-size:.84rem;color:var(--ink-soft)}
.section .rule{height:3px;margin:12px 0 16px;background:var(--ink)}
.section[data-accent="sweet"] h2{color:var(--sweet)}
.section[data-accent="sweet"] .rule{background:var(--sweet)}
.section[data-accent="savory"] h2{color:var(--savory)}
.section[data-accent="savory"] .rule{background:var(--savory)}

.item{
  display:flex;align-items:baseline;gap:6px;
  padding:7px 0;
}
.item+.item{border-top:1px solid var(--rule)}
.item .name{font-weight:500}
.item .dots{
  flex:1;
  border-bottom:1px dotted #B9A98D;
  transform:translateY(-4px);
  min-width:14px;
}
.item .price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item .price.todo{color:#B4342F}
.item .desc{
  flex-basis:100%;
  font-size:.83rem;color:var(--ink-soft);
  margin-top:2px;
}
.item .tags{
  flex-basis:100%;margin-top:5px;
  display:flex;flex-wrap:wrap;gap:4px;
}
.tag{
  font-size:.68rem;font-weight:600;
  background:#EFE3CC;color:#6B5233;
  border-radius:3px;padding:2px 6px;
}
.tag.halal{background:#DFEBDD;color:#3D6B45}

.feature .name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.05rem}

/* ---------- Vignettes (plats vedettes) ---------- */
.item.withphoto{flex-wrap:wrap;align-items:flex-start;padding:12px 0}
.thumb{
  flex:0 0 78px;width:78px;height:78px;
  margin-right:12px;border-radius:2px;overflow:hidden;
  background:#EAD9BC;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.missing::after{
  content:attr(data-label);
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;
  font-size:.6rem;font-weight:600;color:#A08657;
  background:repeating-linear-gradient(45deg,#EFE1C6 0 8px,#E7D6B6 8px 16px);
}
.item.withphoto .name{flex:1 1 auto}
.item.withphoto .dots{display:none}
.item.withphoto .price{margin-left:8px}
.item.withphoto .desc{flex-basis:100%;margin-left:90px;margin-top:3px}
.item.withphoto .tags{margin-left:90px}
@media (max-width:520px){
  .item.withphoto .desc,.item.withphoto .tags{margin-left:0}
}

.note{
  background:#F2E7D0;border-left:3px solid var(--gold);
  padding:10px 12px;margin:14px 0 0;
  font-size:.82rem;color:#6B5233;
}

/* ---------- Pied ---------- */
.foot{
  margin-top:26px;color:#C9AE93;font-size:.78rem;line-height:1.6;
  padding:0 6px;
}
.foot p{margin:0 0 8px}
.foot a{color:var(--gold)}

@media (min-width:700px){
  .board{padding:34px 40px 40px}
  .item .desc{flex-basis:auto;margin:0 0 0 4px;order:2}
}

/* ---------- Impression A4 ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:9.5pt}
  .langs,.nav,.foot .screen-only{display:none}
  .sign{background:none;color:#000;border-bottom:2px solid #000;padding:0 0 10px;text-align:left}
  .sign h1{font-size:26pt}
  .sign .meta,.sign .meta b{color:#000}
  .wrap{max-width:none;padding:0}
  .board{padding:12pt 0 0;box-shadow:none;background:none;columns:2;column-gap:14mm}
  .section{break-inside:avoid}
  .section h2,.section[data-accent] h2{color:#000}
  .section .rule,.section[data-accent] .rule{background:#000;height:2px}
  .item{padding:3px 0}
  .thumb{display:none}
  .item.withphoto .desc,.item.withphoto .tags{margin-left:0}
  .item.withphoto .dots{display:block}
  .foot{color:#000;margin-top:10pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function thumb(it){
  const src=PHOTO_TEST||`photos/${slug(it.name)}.jpg`;
  return `<span class="thumb" data-label="${it.name}">
    <img src="${src}" alt="${it.name}" width="78" height="78" loading="lazy"
         onerror="this.parentNode.classList.add('missing');this.remove()">
  </span>`;
}

const LANGS=[["fr","Français"],["en","English"],["es","Español"],["it","Italiano"]];
const CODES=LANGS.map(l=>l[0]);
let L=0;

const t=(arr)=>arr[L];
const price=(p)=>p===null?`<span class="price todo">${t(UI.todo)}</span>`
  :`<span class="price">${p.toFixed(2).replace(".",",")} €</span>`;

function itemName(it){
  if(it.name) return it.name;
  let parts=it.ing.map(k=>t(ING[k]));
  let s=parts.join(" · ");
  if(it.alt) s+=" / "+it.alt.map(k=>t(ING[k])).join(" / ");
  return s;
}
function itemDesc(it){
  return it.name ? it.ing.map(k=>t(ING[k])).join(", ") : "";
}
function tags(it,sec){
  const keys=[...new Set([...(sec.alg||[]),...(it.alg||[])])];
  let html=keys.map(k=>`<span class="tag">${t(ALG[k])}</span>`).join("");
  if(it.halal) html+=`<span class="tag halal">${t(UI.halal)}</span>`;
  return html?`<div class="tags">${html}</div>`:"";
}

function render(){
  document.documentElement.lang=CODES[L];
  document.getElementById("hours").textContent=t(UI.hours);

  document.getElementById("langs").innerHTML=LANGS.map((l,i)=>
    `<button data-i="${i}" aria-pressed="${i===L}">${l[1]}</button>`).join("");

  document.getElementById("nav").innerHTML=MENU.map(s=>
    `<a href="#${s.id}">${t(s.title)}</a>`).join("");

  document.getElementById("board").innerHTML=MENU.map(s=>`
    <section class="section${s.feature?" feature":""}" id="${s.id}"${s.accent?` data-accent="${s.accent}"`:""}>
      <h2>${t(s.title)}</h2>
      ${s.sub?`<p class="sub">${t(s.sub)}</p>`:""}
      <div class="rule"></div>
      ${s.free?`<p class="note">${t(UI.free)}</p>`:""}
      ${s.supp?`<p class="note">${t(UI.supp)}</p>`:""}
      ${s.items.map(it=>`
        <div class="item${s.photos&&it.name?" withphoto":""}">
          ${s.photos&&it.name?thumb(it):""}
          <span class="name">${itemName(it)}</span>
          <span class="dots"></span>
          ${price(it.price)}
          ${itemDesc(it)?`<span class="desc">${itemDesc(it)}</span>`:""}
          ${tags(it,s)}
        </div>`).join("")}
    </section>`).join("");

  document.getElementById("foot").innerHTML=`
    <p>${t(UI.priceNote)}</p>
    <p>${t(UI.allergNote)}</p>
    <p class="screen-only">Chez Nicos · 44 rue Mouffetard, 75005 Paris · <a href="tel:+33145872813">01 45 87 28 13</a></p>`;
}

document.getElementById("langs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  L=+b.dataset.i;
  render();
  /* Mise à jour de l'URL pour pouvoir partager un lien dans une langue
     précise. Échoue silencieusement en file:// ou en iframe (origine
     nulle) : le changement de langue doit marcher dans tous les cas. */
  try{
    const u=new URL(location);
    u.searchParams.set("lang",CODES[L]);
    history.replaceState(null,"",u);
  }catch(err){/* sans conséquence */}
});

/* Langue : paramètre d'URL, sinon langue du téléphone, sinon français */
(function init(){
  let p=null;
  try{ p=new URLSearchParams(location.search).get("lang"); }catch(err){}
  const nav=(navigator.language||"fr").slice(0,2).toLowerCase();
  const i=CODES.indexOf(p||nav);
  L=i>-1?i:0;
  render();
})();
</script>
</body>
</html>
