<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chez Nicos — Crêperie, 44 rue Mouffetard, Paris 5e</title>
<meta name="description" content="La carte de Chez Nicos, crêperie rue Mouffetard à Paris. Crêpes sucrées, galettes de sarrasin, crêpes garnies et paninis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy:#5A1520;
  --burgundy-deep:#3B0C14;
  --cream:#F7EFDD;
  --board:#FCF8EF;
  --ink:#241416;
  --ink-soft:#5E4741;
  --gold:#D9A431;
  --sweet:#C74F84;
  --savory:#3C6FB5;
  --rule:#DCCDB4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--burgundy-deep);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  font-size:17.5px;
  line-height:1.5;
  text-rendering:optimizeLegibility;
}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 64px}

/* ---------- Enseigne ---------- */
.sign{
  background:var(--burgundy);
  color:var(--cream);
  padding:22px 20px 16px;
  text-align:center;
  border-bottom:5px solid var(--gold);
}
.sign h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-optical-sizing:auto;
  font-weight:800;
  font-size:clamp(2rem,9vw,2.9rem);
  line-height:.95;
  margin:0;
  letter-spacing:-.02em;
}
.sign .meta{
  margin:8px auto 0;
  max-width:34ch;
  font-size:.82rem;
  color:#E0C9A8;
}
.sign .meta b{color:var(--cream);font-weight:600}

/* ---------- Langues ---------- */
.langs{
  display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  padding:14px 12px 4px;background:var(--burgundy-deep);
}
.langs button{
  font:inherit;font-size:.85rem;font-weight:600;
  background:transparent;color:#E2C9AA;
  border:1px solid #7A343F;border-radius:999px;
  padding:8px 15px;min-height:42px;cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--burgundy-deep);border-color:var(--gold)}
.langs button:focus-visible,.nav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Sommaire ---------- */
.nav{
  display:flex;gap:8px;overflow-x:auto;padding:12px 4px;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav a{
  flex:0 0 auto;text-decoration:none;
  font-size:.8rem;font-weight:600;letter-spacing:.01em;
  color:var(--cream);border:1px solid #6E2C36;border-radius:999px;
  padding:7px 14px;white-space:nowrap;
}

/* ---------- Panneau ---------- */
.board{
  background:var(--board);
  border-radius:3px;
  padding:26px 20px 34px;
  box-shadow:0 1px 0 #fff inset, 0 18px 40px rgba(0,0,0,.28);
}
.section+.section{margin-top:38px}
.section{scroll-margin-top:76px}
.section h2{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:700;font-size:1.7rem;margin:0;
  letter-spacing:-.01em;color:var(--burgundy);
}
.section .sub{margin:4px 0 0;font-size:.9rem;color:var(--ink-soft)}
.section .rule{
  height:0;margin:12px 0 16px;
  border-top:3px solid var(--burgundy);
  border-bottom:1px solid var(--gold);
  padding-bottom:2px;
}
.sticky-head{
  position:sticky;top:0;z-index:10;
  background:var(--board);
  padding-top:12px;
}
.section[data-accent="sweet"] .rule{border-top-color:var(--sweet)}
.section[data-accent="savory"] .rule{border-top-color:var(--burgundy)}

.item{
  display:block;
  padding:11px 0;
}
.item .line{display:flex;align-items:flex-end}
.item+.item{border-top:1px solid var(--rule)}
.item .name{font-weight:500;line-height:1.35;flex:0 1 auto;min-width:0}
.item .dots{
  flex:1 1 16px;
  border-bottom:1px dotted #C6B69A;
  margin:0 10px 7px;
  min-width:16px;
}
.item .price{
  flex:0 0 5.2rem;width:5.2rem;text-align:right;
  font-variant-numeric:tabular-nums;font-weight:700;
  font-size:1.05rem;line-height:1.35;
}
.item .price.todo{
  font-size:.74rem;font-weight:600;line-height:1.25;
  color:#A32A25;letter-spacing:.01em;
}
.item .desc{
  flex-basis:100%;
  font-size:.88rem;color:var(--ink-soft);
  margin-top:3px;
}
.item .tags{
  flex-basis:100%;margin-top:7px;
  display:flex;flex-wrap:wrap;gap:5px;
}
.tag{
  font-size:.75rem;font-weight:600;
  background:#EBDCC0;color:#5A4423;
  border-radius:3px;padding:3px 7px;
}
.tag.halal{background:#D8E7D5;color:#2F5B3A}

.print-only{display:none}
.alg-line{
  font-size:.82rem;color:var(--ink-soft);
  margin:0 0 14px;
}
.alg-line b{font-weight:600;color:var(--ink)}

/* ---------- Composeur ---------- */
.compose-open{
  display:block;width:100%;
  margin:0 0 22px;padding:22px 20px;
  font:inherit;font-weight:800;font-size:1.35rem;line-height:1.15;
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  background:var(--burgundy);color:var(--cream);
  border:none;border-bottom:5px solid var(--gold);
  border-radius:3px;cursor:pointer;text-align:left;
}
.compose-open small{
  display:block;font-family:"Instrument Sans",sans-serif;
  font-weight:500;font-size:.88rem;color:#E2C08C;margin-top:6px;
}
.sheet{
  position:fixed;inset:0;z-index:60;
  background:var(--board);
  display:none;flex-direction:column;
}
.sheet.open{display:flex}
.sheet-head{
  background:var(--burgundy);color:var(--cream);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.sheet-head h2{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:1.15rem;margin:0;flex:1;
}
.sheet-head button{
  font:inherit;font-size:1.6rem;line-height:1;
  background:none;border:none;color:var(--cream);
  padding:4px 10px;min-height:44px;cursor:pointer;
}
.sheet-body{flex:1;overflow-y:auto;padding:18px 16px 190px}
.seg{display:flex;gap:8px;margin-bottom:20px}
.seg button{
  flex:1;font:inherit;font-weight:600;font-size:.95rem;
  padding:12px;min-height:48px;cursor:pointer;
  background:#EFE3CC;color:#5A4423;
  border:1px solid var(--rule);border-radius:3px;
}
.seg button[aria-pressed="true"]{background:var(--burgundy);color:var(--cream);border-color:var(--burgundy)}
.grp-title{
  font-size:.78rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);
  margin:20px 0 10px;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;font-size:.95rem;font-weight:500;
  padding:11px 15px;min-height:46px;cursor:pointer;
  background:#fff;color:var(--ink);
  border:1.5px solid var(--rule);border-radius:999px;
}
.chip[aria-pressed="true"]{
  background:var(--burgundy);color:var(--cream);border-color:var(--burgundy);
}
.chip .free{font-size:.72rem;opacity:.7;margin-left:5px}

.tally{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--burgundy);color:var(--cream);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  display:none;
  box-shadow:0 -8px 24px rgba(0,0,0,.3);
}
.sheet.open .tally{display:block}
.tally .line{font-size:.9rem;color:#E8D5B4;margin-bottom:8px;line-height:1.4}
.tally .row{display:flex;align-items:center;gap:12px}
.tally .total{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:1.7rem;font-weight:800;flex:1;
  font-variant-numeric:tabular-nums;
}
.tally .est{font-size:.7rem;font-weight:500;color:#E2C08C;display:block;margin-top:1px}
.tally .show{
  font:inherit;font-weight:700;font-size:1rem;
  background:var(--gold);color:#3B0C14;
  border:none;border-radius:3px;padding:14px 18px;
  min-height:50px;cursor:pointer;
}
.tally .show:disabled{opacity:.4;cursor:default}

/* ---------- Panneau à montrer au comptoir ---------- */
.counter{
  position:fixed;inset:0;z-index:70;
  background:#FFFDF7;color:#000;
  display:none;flex-direction:column;
  padding:26px 22px calc(26px + env(safe-area-inset-bottom));
}
.counter.open{display:flex}
.counter .hello{
  font-size:1.05rem;color:#555;margin:0 0 18px;
}
.counter .dish{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:800;font-size:2.1rem;line-height:1.1;
  margin:0 0 14px;
}
.counter .detail{font-size:1.15rem;line-height:1.5;margin:0 0 auto}
.counter .money{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:800;font-size:2.6rem;margin:20px 0 4px;
  font-variant-numeric:tabular-nums;
}
.counter .money small{display:block;font-size:.85rem;font-weight:500;color:#666;font-family:"Instrument Sans",sans-serif}
.counter .echo{font-size:1rem;color:#666;border-top:2px solid #E2DACA;padding-top:14px;margin-top:14px}
.counter .close{
  font:inherit;font-weight:600;font-size:1rem;
  background:#EDE5D5;color:#000;border:none;border-radius:3px;
  padding:16px;min-height:52px;margin-top:20px;cursor:pointer;
}

.feature .name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.05rem}

/* ---------- Vignettes (plats vedettes) ---------- */
.item.withphoto{display:flex;flex-wrap:wrap;align-items:flex-start;padding:12px 0}
.thumb{
  flex:0 0 78px;width:78px;height:78px;
  margin-right:12px;border-radius:2px;overflow:hidden;
  background:#EAD9BC;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.missing::after{
  content:attr(data-label);
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;
  font-size:.6rem;font-weight:600;color:#A08657;
  background:repeating-linear-gradient(45deg,#EFE1C6 0 8px,#E7D6B6 8px 16px);
}
.item.withphoto .line{flex:1 1 200px}
.item.withphoto .dots{display:none}
.item.withphoto .name{flex:1 1 auto}
.item.withphoto .desc{flex-basis:100%;margin-left:90px;margin-top:3px}
.item.withphoto .tags{margin-left:90px}
@media (max-width:520px){
  .item.withphoto .desc,.item.withphoto .tags{margin-left:0}
}

.note{
  background:#F2E7D0;border-left:3px solid var(--gold);
  padding:10px 12px;margin:14px 0 0;
  font-size:.82rem;color:#6B5233;
}

/* ---------- Pied ---------- */
.foot{
  margin-top:26px;color:#C9AE93;font-size:.78rem;line-height:1.6;
  padding:0 6px;
}
.foot p{margin:0 0 8px}
.foot a{color:var(--gold)}

@media (min-width:700px){
  .board{padding:34px 40px 40px}
  .item .desc{flex-basis:auto;margin:0 0 0 4px;order:2}
}

/* ---------- Impression A4 ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:9.5pt}
  .langs,.nav,.foot .screen-only,.compose-open,.sheet,.counter{display:none}
  .print-only{display:block!important}
  .alg-line{display:none}
  .sign{background:none;color:#000;border-bottom:2px solid #000;padding:0 0 10px;text-align:left}
  .sign h1{font-size:26pt}
  .sign .meta,.sign .meta b{color:#000}
  .wrap{max-width:none;padding:0}
  .board{padding:12pt 0 0;box-shadow:none;background:none;columns:2;column-gap:14mm}
  .section{break-inside:avoid}
  .section h2,.section[data-accent] h2{color:#000}
  .section .rule,.section[data-accent] .rule{background:#000;height:2px}
  .item{padding:3px 0}
  .thumb{display:none}
  .item.withphoto .desc,.item.withphoto .tags{margin-left:0}
  .item.withphoto .dots{display:block}
  .foot{color:#000;margin-top:10pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="sign">
  <h1>Chez Nicos</h1>
  <p class="meta"><b>44 rue Mouffetard, 75005 Paris</b><br>
  <span id="hours"></span></p>
</header>

<nav class="langs" id="langs" aria-label="Langue"></nav>

  <footer class="foot" id="foot"></footer>

<!-- Composeur -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">

  <div class="tally">

    <div class="row">
      <span class="total" id="tallyTotal"></span>
      <button class="show" id="tallyShow"></button>
    </div>
  </div>
</div>

<!-- À montrer au comptoir : toujours en français -->
<div class="counter" id="counter" role="dialog" aria-modal="true" aria-hidden="true">
  <p class="hello" id="cHello"></p>
  <h2 class="dish" id="cDish"></h2>

/* =====================================================================
   2. LA CARTE
   price : nombre, ou null si le prix reste à renseigner.
   ing   : liste de clés du dictionnaire ci-dessus.
   ===================================================================== */

   3. RENDU

/* --- PHOTOS ---------------------------------------------------------
   PHOTOS_READY reste à false tant que les vraies photos n'ont pas été
   prises : un emplacement vide fait plus de mal qu'une absence de photo.
   Passer à true le jour du shooting.

   Chaque plat vedette cherche alors son image dans photos/<slug>.jpg
   (ex. « La Crêpe Maison » → photos/la-crepe-maison.jpg).

   PHOTO_TEST : chemin unique pour afficher la MÊME image partout
   pendant les tests de mise en page. Remettre à null avant publication.
   -------------------------------------------------------------------- */
const PHOTOS_READY = false;
const PHOTO_TEST = null;

const slug=s=>s.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function thumb(it){
  const src=PHOTO_TEST||`photos/${slug(it.name)}.jpg`;
  return `<span class="thumb" data-label="${it.name}">
    <img src="${src}" alt="${it.name}" width="78" height="78" loading="lazy"
         onerror="this.parentNode.classList.add('missing');this.remove()">
  </span>`;
}

const LANGS=[["fr","Français"],["en","English"],["es","Español"],["it","Italiano"]];
const CODES=LANGS.map(l=>l[0]);
let L=0;

const t=(arr)=>arr[L];
const price=(p)=>p===null?`<span class="price todo">${t(UI.todo)}</span>`
  :`<span class="price">${p.toFixed(2).replace(".",",")} €</span>`;

function itemName(it){
  if(it.name) return it.name;
  let parts=it.ing.map(k=>t(ING[k]));
  let s=parts.join(" · ");
  if(it.alt) s+=" / "+it.alt.map(k=>t(ING[k])).join(" / ");
  return s;
}
function itemDesc(it){
  return it.name ? it.ing.map(k=>t(ING[k])).join(", ") : "";
}
function tags(it,sec){
  /* Les allergènes communs à toute la section sont annoncés une seule
     fois en tête de section : ne restent ici que les spécificités. */
  const keys=(it.alg||[]).filter(k=>!(sec.alg||[]).includes(k));
  let html=keys.map(k=>`<span class="tag">${t(ALG[k])}</span>`).join("");
  if(it.halal) html+=`<span class="tag halal">${t(UI.halal)}</span>`;
  return html?`<div class="tags">${html}</div>`:"";
}
function algLine(sec){
  if(!sec.alg||!sec.alg.length) return "";
  return `<p class="alg-line"><b>${t(UI.algAll)}</b> ${sec.alg.map(k=>t(ALG[k])).join(", ")}</p>`;
}

          </div>
          ${itemDesc(it)?`<span class="desc">${itemDesc(it)}</span>`:""}

        </div>`).join("")}

  document.getElementById("foot").innerHTML=`

/* =====================================================================
   4. COMPOSEUR « composez votre crêpe »
   Le prix n'est PAS additif sur la carte de Nicos : ce sont des
   combinaisons à prix fixe, plus 2 € par ingrédient supplémentaire.
   On cherche donc d'abord une combinaison exacte dans la carte ;
   à défaut, on part de la combinaison connue la plus proche et on
   ajoute 2 € par ingrédient restant — affiché comme une ESTIMATION.
   ===================================================================== */
const SUPP_PRICE=2.00;
const FREE_ING=["tomates","salade","oignons"];

const COMPOSE={
  salee:{
    sections:["salees","garnitures"],
    groups:[
      ["Protéines",["oeuf","jambon","poulet","dinde","thon","bacon","chorizo","coppa","viande"]],
      ["Fromages",["fromage","feta","chevre","mozzarella","raclette","emmental"]],
      ["Légumes",["champignons","pdt","aubergines","epinards","poivrons","courgette"]]
    ]
  },
  sucree:{
    sections:["sucrees"],
    groups:[
      ["Pâtes à tartiner",["nutella","marron","chocolat","caramel","speculoos","confiture"]],
      ["Fruits",["banane","compote","citron","coco"]],
      ["Autres",["miel","noisettes","amandes","grand_marnier","beurre_sucre"]]
    ]
  }
};
const GRP_LABEL={
  "Protéines":["Protéines","Proteins","Proteínas","Proteine"],
  "Fromages":["Fromages","Cheeses","Quesos","Formaggi"],
  "Légumes":["Légumes","Vegetables","Verduras","Verdure"],
  "Pâtes à tartiner":["Pâtes à tartiner","Spreads","Cremas","Creme spalmabili"],
  "Fruits":["Fruits","Fruit","Frutas","Frutta"],
  "Autres":["Autres","Others","Otros","Altri"]
};

let base="salee";
let picked=new Set();

const eqSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));

/* Cherche la combinaison exacte, sinon la plus proche incluse dans la
   sélection. Renvoie {price, exact} ou {price:null} si rien de connu. */
function computePrice(){
  const sel=[...picked].filter(k=>!FREE_ING.includes(k));
  if(!sel.length) return {price:null,exact:false};

  const pool=[];
  COMPOSE[base].sections.forEach(id=>{
    const s=MENU.find(m=>m.id===id);
    if(s) s.items.forEach(it=>{ if(it.price!==null&&!it.name) pool.push(it); });
  });

  const exact=pool.find(it=>eqSet(it.ing,sel));
  if(exact) return {price:exact.price,exact:true};

  let best=null;
  pool.forEach(it=>{
    if(it.ing.every(k=>sel.includes(k))){
      if(!best||it.ing.length>best.ing.length) best=it;
    }
  });
  if(!best) return {price:null,exact:false};
  const extra=sel.length-best.ing.length;
  return {price:best.price+extra*SUPP_PRICE,exact:false};
}

function renderCompose(){
  document.getElementById("composeOpen").innerHTML=
    `${t(UI.cTitle)}<small>${t(UI.cSub)}</small>`;
  document.getElementById("sheetTitle").textContent=t(UI.cTitle);
  document.getElementById("cClose").textContent=t(UI.cClose);

  const groups=COMPOSE[base].groups.map(([label,keys])=>`
    <p class="grp-title">${t(GRP_LABEL[label])}</p>
    <div class="chips">
      ${keys.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${picked.has(k)}">${t(ING[k])}</button>`).join("")}
    </div>`).join("");

  const free=base==="salee"?`
    <p class="grp-title">${t(UI.cFreeGrp)}</p>
    <div class="chips">
      ${FREE_ING.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${picked.has(k)}">${t(ING[k])}<span class="free">${t(UI.cFree)}</span></button>`).join("")}
    </div>`:"";

  document.getElementById("sheetBody").innerHTML=`
    <div class="seg">
      <button data-base="salee" aria-pressed="${base==="salee"}">${t(UI.cSalee)}</button>
      <button data-base="sucree" aria-pressed="${base==="sucree"}">${t(UI.cSucree)}</button>
    </div>
    ${groups}${free}`;

  updateTally();
}

function updateTally(){
  const r=computePrice();
  const names=[...picked].map(k=>t(ING[k])).join(", ");
  document.getElementById("tallyLine").textContent=names||t(UI.cEmpty);
  const tot=document.getElementById("tallyTotal");
  if(r.price===null){
    tot.innerHTML=picked.size?`<span style="font-size:1rem">${t(UI.cAsk)}</span>`:"—";
  }else{
    tot.innerHTML=`${r.price.toFixed(2).replace(".",",")} €
      <span class="est">${r.exact?t(UI.cExact):t(UI.cEstim)}</span>`;
  }
  const btn=document.getElementById("tallyShow");
  btn.textContent=t(UI.cShow);
  btn.disabled=!picked.size;
}

/* Le panneau comptoir est TOUJOURS en français : c'est le vendeur qui lit. */
function showCounter(){
  const r=computePrice();
  const fr=k=>ING[k][0];
  const sel=[...picked];
  document.getElementById("cHello").textContent=t(UI.cHello);
  document.getElementById("cDish").textContent=base==="salee"?UI.cSaleeName[0]:UI.cSucreeName[0];
  document.getElementById("cDetail").textContent=sel.map(fr).join(" · ");
  document.getElementById("cMoney").innerHTML=r.price===null
    ? `<span style="font-size:1.4rem">Prix à confirmer</span>`
    : `${r.price.toFixed(2).replace(".",",")} €<small>${r.exact?"Prix de la carte":"Estimation — à confirmer"}</small>`;
  document.getElementById("cEcho").textContent=
    L===0?"":`${t(UI.cYours)} : ${sel.map(k=>t(ING[k])).join(", ")}`;
  openPanel("counter");
}

/* Ouverture / fermeture des panneaux. Chaque ouverture empile un état
   d'historique : le bouton retour du téléphone ferme le panneau au lieu
   de quitter la page — sinon on perd sa sélection d'un geste. */
function openPanel(id){
  const el=document.getElementById(id);
  el.classList.add("open");
  el.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  try{ history.pushState({panel:id},""); }catch(err){}
}
function closePanel(id,pop){
  const el=document.getElementById(id);
  if(!el.classList.contains("open")) return;
  el.classList.remove("open");
  el.setAttribute("aria-hidden","true");
  if(!document.querySelector(".sheet.open,.counter.open")) document.body.style.overflow="";
  if(!pop){ try{ history.back(); }catch(err){} }
}
window.addEventListener("popstate",()=>{
  if(document.getElementById("counter").classList.contains("open")) closePanel("counter",true);
  else closePanel("sheet",true);
});

document.getElementById("composeOpen").addEventListener("click",()=>{
  openPanel("sheet");
  renderCompose();
});
document.getElementById("sheetClose").addEventListener("click",()=>closePanel("sheet"));
document.getElementById("cClose").addEventListener("click",()=>closePanel("counter"));
document.getElementById("sheetBody").addEventListener("click",e=>{
  const seg=e.target.closest("[data-base]");
  if(seg){ base=seg.dataset.base; picked.clear(); renderCompose(); return; }
  const chip=e.target.closest(".chip");
  if(!chip) return;
  const k=chip.dataset.k;
  picked.has(k)?picked.delete(k):picked.add(k);
  chip.setAttribute("aria-pressed",picked.has(k));
  updateTally();
});
document.getElementById("tallyShow").addEventListener("click",showCounter);
document.getElementById("cClose").addEventListener("click",()=>{
  document.getElementById("counter").classList.remove("open");
  document.getElementById("counter").setAttribute("aria-hidden","true");
});

document.getElementById("langs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  L=+b.dataset.i;
  render();
  /* Mise à jour de l'URL pour pouvoir partager un lien dans une langue
     précise. Échoue silencieusement en file:// ou en iframe (origine
     nulle) : le changement de langue doit marcher dans tous les cas. */
  try{
    const u=new URL(location);
    u.searchParams.set("lang",CODES[L]);
    history.replaceState(null,"",u);
  }catch(err){/* sans conséquence */}
});

/* Langue : paramètre d'URL, sinon langue du téléphone, sinon français */
(function init(){
  let p=null;
  try{ p=new URLSearchParams(location.search).get("lang"); }catch(err){}
  const nav=(navigator.language||"fr").slice(0,2).toLowerCase();
  const i=CODES.indexOf(p||nav);
  L=i>-1?i:0;
  render();
})();
</script>
